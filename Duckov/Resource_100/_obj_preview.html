<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OBJ Preview</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#20242a;color:#eee;font:14px sans-serif}
#bar{position:fixed;z-index:2;top:0;left:0;right:0;padding:10px;background:#111a;display:flex;gap:10px;align-items:center}
#view{width:100%;height:100%} input{max-width:420px}
</style>
</head>
<body>
<div id="bar"><label>OBJ <input id="obj" type="file" accept=".obj"></label><label>Texture <input id="tex" type="file" accept="image/*"></label><span id="status">Choose an OBJ file.</span></div>
<div id="view"></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {OBJLoader} from 'three/addons/loaders/OBJLoader.js';
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x20242a);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.01,10000); camera.position.set(2,2,3);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(devicePixelRatio); renderer.setSize(innerWidth,innerHeight); document.getElementById('view').appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement); controls.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xffffff,0x334455,2)); const key=new THREE.DirectionalLight(0xffffff,3); key.position.set(3,5,4); scene.add(key);
const grid=new THREE.GridHelper(10,20,0x667788,0x334455); scene.add(grid); let object=null, texture=null;
function fit(o){const box=new THREE.Box3().setFromObject(o), size=box.getSize(new THREE.Vector3()), center=box.getCenter(new THREE.Vector3()); o.position.sub(center); const max=Math.max(size.x,size.y,size.z)||1; camera.position.set(max*1.5,max*1.1,max*1.5); camera.near=max/1000; camera.far=max*100; camera.updateProjectionMatrix(); controls.target.set(0,0,0); controls.update();}
function loadObj(file){const reader=new FileReader(); reader.onload=()=>{if(object)scene.remove(object); object=new OBJLoader().parse(reader.result); object.traverse(m=>{if(m.isMesh){m.material=new THREE.MeshStandardMaterial({color:0xb8b8b8,roughness:.7,metalness:.05,side:THREE.DoubleSide}); if(texture)m.material.map=texture; m.material.needsUpdate=true;}}); scene.add(object); fit(object); document.getElementById('status').textContent=file.name;}; reader.readAsText(file);}
document.getElementById('obj').onchange=e=>e.target.files[0]&&loadObj(e.target.files[0]);
document.getElementById('tex').onchange=e=>{const f=e.target.files[0];if(!f)return;new THREE.TextureLoader().load(URL.createObjectURL(f),t=>{texture=t;if(object)object.traverse(m=>{if(m.isMesh){m.material.map=t;m.material.needsUpdate=true;}});});};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}); (function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)})();
</script>
</body>
</html>
